version: "3.9"

services:
  app:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - uploads:/app/uploads
      - processed:/app/processed
      - saved_projects:/app/saved_projects
    environment:
      - PORT=8000
    restart: unless-stopped

volumes:
  uploads:
  processed:
  saved_projects:
